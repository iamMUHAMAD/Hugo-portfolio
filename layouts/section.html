{{- /* Fallback for any future content section (projects has its own layout). */ -}}
{{- define "main" }}
<div class="container page">
  <header class="page-header">
    <h1 class="page-header__title">{{ .Title }}</h1>
    {{- with .Description }}<p class="page-header__lead">{{ . }}</p>{{ end }}
  </header>
  {{- with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <ul class="link-list" role="list">
    {{- range .Pages }}<li><a class="text-link" href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
  </ul>
</div>
{{- end }}
