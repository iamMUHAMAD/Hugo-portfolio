{{- define "main" }}
<div class="container page">
  <header class="page-header">
    <p class="eyebrow mono">Portfolio</p>
    <h1 class="page-header__title">{{ .Title }}</h1>
    {{- with .Params.intro }}<p class="page-header__lead">{{ . }}</p>{{ end }}
  </header>

  {{- with .Pages.ByWeight }}
    <div class="project-grid project-grid--wide">
      {{- range . }}{{ partial "project-card.html" . }}{{ end }}
    </div>
  {{- else }}
    <p>{{ partial "placeholder.html" "Projects" }}</p>
  {{- end }}
</div>
{{- end }}
