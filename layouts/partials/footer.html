{{- $profile := hugo.Data.profile }}
<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__copy">
      © {{ now.Year }} {{ $profile.name }}
      <span class="site-footer__sep" aria-hidden="true">·</span>
      <span class="mono">Built with Hugo</span>
    </p>
    <ul class="site-footer__links" role="list">
      {{- range $profile.social }}
        {{- if .url }}
          <li><a href="{{ .url }}" rel="me noopener">{{ .name }}</a></li>
        {{- end }}
      {{- end }}
      <li><a href="#main" class="site-footer__top">Back to top <span aria-hidden="true">↑</span></a></li>
    </ul>
  </div>
</footer>
