# Netlify build settings (used instead of GitHub Actions).
# Netlify builds the site on every push to main and publishes the public/ folder.
# $URL is set by Netlify to the site's main address (e.g. https://your-site.netlify.app),
# so baseURL in hugo.toml is overridden and all links match the Netlify domain.

[build]
  publish = "public"
  command = "hugo --gc --minify --panicOnWarning --baseURL \"$URL/\""

[build.environment]
  HUGO_VERSION = "0.170.1"
  HUGO_ENVIRONMENT = "production"

# Fingerprinted CSS/JS and fonts never change at the same URL, so they can be cached long-term.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
